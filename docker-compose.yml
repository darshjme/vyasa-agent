services:
  vyasa:
    build: .
    restart: unless-stopped
    environment:
      VYASA_HOME: /var/lib/vyasa
      VYASA_PROVIDER: ${VYASA_PROVIDER:-openrouter}
      VYASA_MODEL: ${VYASA_MODEL:-}
      VYASA_BASE_URL: ${VYASA_BASE_URL:-}
      VYASA_API_KEY: ${VYASA_API_KEY:-}
    ports:
      - "127.0.0.1:19000:19000"
    volumes:
      - vyasa_home:/var/lib/vyasa
volumes:
  vyasa_home:
