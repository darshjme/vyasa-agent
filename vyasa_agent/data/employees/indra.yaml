schema_version: 1
id: indra
display_name: Indra
registry_source: vyasa
role_key: sre
system_prompt_ref: "vyasa:sre"
allowed_tools:
  - graph_write
  - graph_read
  - bash
  - file_read
  - file_edit
  - grep
  - glob
  - git
allowed_plugins:
  - memory
  - context_engine
memory_namespace: indra
model_preference:
  default: anthropic/claude-sonnet-4.6
  provider: openrouter
  fallback:
    model: anthropic/claude-haiku-4.5
    provider: openrouter
temperature: 0.2
max_turns: 35
messaging_aliases:
  - "@indra"
  - "@sre"
  - "/ask indra"
visibility: public
tags:
  - tier3
  - enterprise
  - blocking
